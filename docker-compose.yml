name: openwrt-monitoring

networks:
  monitoring:
    name: openwrt-monitoring   # явное имя (иначе compose создаёт openwrt-monitoring_monitoring)
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    ports:
      - '192.168.1.161:9210:9090'
    volumes:
      - ./prometheus/etc:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-14d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-3GB}'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    ports:
      - '192.168.1.161:3210:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?Set GF_SECURITY_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_AUTH_LOGIN_COOKIE_NAME: openwrt_grafana_session
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/etc/provisioning:/etc/grafana/provisioning:ro
      - ./grafana:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
