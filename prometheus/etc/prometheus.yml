global:
  scrape_interval: 1m
  evaluation_interval: 1m

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'openwrt-monitoring'
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(node_netstat_(Tcp_RetransSegs|Tcp_OutSegs|TcpExt_TCPTimeouts|TcpExt_TCPSynRetrans|TcpExt_TCPAbortOnTimeout|Udp_InDatagrams|Udp_OutDatagrams|Udp_InErrors|Udp_RcvbufErrors|Udp_NoPorts|Udp_InCsumErrors))'
        target_label: __name__
        replacement: '${1}_total'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/*.yml'
        refresh_interval: 5m
